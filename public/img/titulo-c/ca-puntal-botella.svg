<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Arial, Helvetica, sans-serif" font-size="13">
<defs>
<marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker>
</defs>
<rect width="640" height="330" fill="#ffffff"/>
<!-- puntal en forma de botella: angosto en los extremos (nodos), ancho en la mitad -->
<path d="M70 125 C 200 70, 440 70, 570 125 L 570 205 C 440 260, 200 260, 70 205 Z" fill="#bfdbfe" fill-opacity="0.75" stroke="#1d4ed8" stroke-width="1.8"/>
<!-- eje del puntal -->
<line x1="40" y1="165" x2="600" y2="165" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="8 4"/>
<!-- zonas nodales -->
<rect x="40" y="115" width="32" height="100" fill="#fde68a" fill-opacity="0.9" stroke="#b45309" stroke-dasharray="4 3"/>
<rect x="568" y="115" width="32" height="100" fill="#fde68a" fill-opacity="0.9" stroke="#b45309" stroke-dasharray="4 3"/>
<!-- fuerzas -->
<line x1="8" y1="165" x2="38" y2="165" stroke="#222" stroke-width="2.4" marker-end="url(#fl)"/>
<line x1="632" y1="165" x2="602" y2="165" stroke="#222" stroke-width="2.4" marker-end="url(#fl)"/>
<text x="6" y="150" fill="#222">C</text>
<text x="620" y="150" fill="#222">C</text>
<!-- grietas / traccion transversal -->
<line x1="260" y1="76" x2="260" y2="254" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 5"/>
<line x1="380" y1="76" x2="380" y2="254" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 5"/>
<text x="268" y="62" fill="#dc2626">tracción transversal por la expansión de la compresión</text>
<text x="170" y="285" fill="#dc2626">(se cruza con refuerzo: C-A.3.3 y Ec. C-A-4, βs = 0.75)</text>
<text x="318" y="318" fill="#222" text-anchor="middle">Ancho medio mayor que el ancho en los nodos: puntal en forma de botella</text>
<text x="56" y="110" fill="#b45309" font-size="12">nodo</text>
<text x="574" y="110" fill="#b45309" font-size="12">nodo</text>
</svg>
