<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Flujo de decisión del Capítulo A.10</title>
  <desc id="d">De la información previa a la evaluación de la estructura existente, el cálculo de los índices de sobreesfuerzo y flexibilidad, y la elección del tipo de intervención.</desc>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="900" fill="#ffffff"/>

  <rect x="150" y="16" width="600" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="450" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">1 · Información previa (Etapas 1–3 · A.10.1.4, A.10.2)</text>
  <text x="450" y="64" text-anchor="middle" font-size="13.5" fill="#1e293b">Alcance · planos y estudios originales · exploración en sitio ·</text>
  <text x="450" y="80" text-anchor="middle" font-size="13.5" fill="#1e293b">calificación de calidad (φc) y estado (φe): buena, regular o mala</text>
  <line x1="450" y1="88" x2="450" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>

  <rect x="150" y="114" width="600" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="450" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">2 · Solicitaciones equivalentes (Etapa 4 · A.10.4.2)</text>
  <text x="450" y="162" text-anchor="middle" font-size="13.5" fill="#1e293b">Nivel de seguridad: nueva (A.2) o limitada (Ae, A.10.3) · sistema y R′</text>
  <text x="450" y="178" text-anchor="middle" font-size="13.5" fill="#1e293b">Fs por fuerza horizontal equivalente (A.4) · E = Fs / R′</text>
  <line x1="450" y1="186" x2="450" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>

  <rect x="150" y="212" width="600" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="450" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">3 · Análisis y resistencia (Etapas 5–7 · A.10.4.3)</text>
  <text x="450" y="260" text-anchor="middle" font-size="13.5" fill="#1e293b">Análisis elástico de estructura y cimentación · resistencia existente Nex</text>
  <text x="450" y="276" text-anchor="middle" font-size="13.5" fill="#1e293b">Resistencia efectiva: Nef = φc · φe · Nex  (A.10-1)</text>
  <line x1="450" y1="284" x2="450" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>

  <rect x="150" y="310" width="600" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="450" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">4 · Índices de la edificación (Etapas 8–10 · A.10.4.3, A.10.5)</text>
  <text x="450" y="358" text-anchor="middle" font-size="13.5" fill="#1e293b">Sobreesfuerzo IS = solicitación equivalente / Nef (máximo de los elementos)</text>
  <text x="450" y="374" text-anchor="middle" font-size="13.5" fill="#1e293b">Flexibilidad IF = deriva obtenida / deriva permitida (A.6) y flechas verticales</text>
  <line x1="450" y1="382" x2="450" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>

  <polygon points="450,410 600,458 450,506 300,458" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="450" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">¿IS &lt; 1 e IF &lt; 1?</text>
  <text x="450" y="473" text-anchor="middle" font-size="12.5" fill="#78350f">con el nivel exigido</text>
  <line x1="600" y1="458" x2="660" y2="458" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <text x="630" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Sí</text>
  <rect x="662" y="428" width="226" height="60" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="775" y="451" text-anchor="middle" font-size="13" fill="#14532d">Sin intervención sísmica</text>
  <text x="775" y="468" text-anchor="middle" font-size="12.5" fill="#14532d">(una ampliación adosada igual</text>
  <text x="775" y="482" text-anchor="middle" font-size="12.5" fill="#14532d">exige junta, A.10.7.1)</text>
  <line x1="450" y1="506" x2="450" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <text x="466" y="528" font-size="13" font-weight="700" fill="#991b1b">No, o se quiere ampliar o modificar</text>

  <rect x="100" y="542" width="700" height="34" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="450" y="565" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">5 · Tipo de intervención (Etapa 11 · A.10.6)</text>

  <line x1="450" y1="576" x2="450" y2="590" stroke="#475569" stroke-width="2"/>
  <line x1="122" y1="590" x2="770" y2="590" stroke="#475569" stroke-width="2"/>
  <line x1="122" y1="590" x2="122" y2="610" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <line x1="335" y1="590" x2="335" y2="610" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <line x1="549" y1="590" x2="549" y2="610" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <line x1="770" y1="590" x2="770" y2="610" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>

  <rect x="22" y="612" width="200" height="104" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="122" y="636" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7c2d12">Ampliación adosada</text>
  <text x="122" y="654" text-anchor="middle" font-size="12.5" fill="#1e293b">A.10.7 · más área, misma</text>
  <text x="122" y="670" text-anchor="middle" font-size="12.5" fill="#1e293b">altura · junta (A.6) o trabajo</text>
  <text x="122" y="686" text-anchor="middle" font-size="12.5" fill="#1e293b">en conjunto · IS, IF &lt; 1</text>
  <text x="122" y="704" text-anchor="middle" font-size="12" fill="#7c2d12">nivel de edificación nueva</text>

  <rect x="235" y="612" width="200" height="104" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="335" y="636" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7c2d12">Ampliación en altura</text>
  <text x="335" y="654" text-anchor="middle" font-size="12.5" fill="#1e293b">A.10.8 · todo el conjunto</text>
  <text x="335" y="670" text-anchor="middle" font-size="12.5" fill="#1e293b">se reanaliza · empalmes ·</text>
  <text x="335" y="686" text-anchor="middle" font-size="12.5" fill="#1e293b">cimentación y vuelco</text>
  <text x="335" y="704" text-anchor="middle" font-size="12" fill="#7c2d12">nivel de edificación nueva</text>

  <rect x="449" y="612" width="200" height="104" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="549" y="636" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7c2d12">Rehabilitación sísmica</text>
  <text x="549" y="654" text-anchor="middle" font-size="12.5" fill="#1e293b">A.10.9 · nivel según grupo</text>
  <text x="549" y="670" text-anchor="middle" font-size="12.5" fill="#1e293b">de uso y época de diseño:</text>
  <text x="549" y="686" text-anchor="middle" font-size="12.5" fill="#1e293b">nueva o seguridad limitada</text>
  <text x="549" y="704" text-anchor="middle" font-size="12" fill="#7c2d12">(con memorial notarial)</text>

  <rect x="662" y="612" width="216" height="104" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="770" y="636" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7c2d12">Reparación por sismo</text>
  <text x="770" y="654" text-anchor="middle" font-size="12.5" fill="#1e293b">A.10.10 · daño moderado a</text>
  <text x="770" y="670" text-anchor="middle" font-size="12.5" fill="#1e293b">severo, sin demolición total ·</text>
  <text x="770" y="686" text-anchor="middle" font-size="12.5" fill="#1e293b">alcance según el tipo de daño</text>
  <text x="770" y="704" text-anchor="middle" font-size="12" fill="#7c2d12">(grupos III y IV: A.10.9.2.1)</text>

  <line x1="122" y1="716" x2="122" y2="750" stroke="#475569" stroke-width="2"/>
  <line x1="335" y1="716" x2="335" y2="750" stroke="#475569" stroke-width="2"/>
  <line x1="549" y1="716" x2="549" y2="750" stroke="#475569" stroke-width="2"/>
  <line x1="770" y1="716" x2="770" y2="750" stroke="#475569" stroke-width="2"/>
  <line x1="122" y1="750" x2="770" y2="750" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="750" x2="450" y2="774" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>

  <rect x="100" y="776" width="700" height="100" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="450" y="802" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">6 · Nuevo análisis, diseño y construcción (Etapa 12 · A.10.1.5, A.10.1.6)</text>
  <text x="450" y="825" text-anchor="middle" font-size="13.5" fill="#1e293b">Se analiza el conjunto con la intervención y se diseña para esas fuerzas</text>
  <text x="450" y="843" text-anchor="middle" font-size="13.5" fill="#1e293b">Memoria de cálculos firmada por ingeniero civil matriculado</text>
  <text x="450" y="861" text-anchor="middle" font-size="13.5" fill="#1e293b">Supervisión técnica en todos los casos · se confirman en obra las hipótesis del diseño</text>
</svg>
